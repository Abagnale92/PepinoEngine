<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Pepino</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #game { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; outline: none; }
      #loading {
        position: fixed; inset: 0; display: grid; place-content: center; gap: 14px;
        color: #cfe8c4; font: 600 14px/1.4 "Segoe UI", system-ui, sans-serif; text-align: center; background: #0f140f;
      }
      #track { width: 220px; height: 6px; background: #243324; border-radius: 3px; overflow: hidden; }
      #bar { width: 0; height: 100%; background: #8cc480; transition: width .15s; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="loading"><span>Caricamento…</span><div id="track"><div id="bar"></div></div></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
